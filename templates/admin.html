<!DOCTYPE html>
<html dir="rtl" lang="ar">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>إدارة المتجر</title>
    <style>
        body { font-family: sans-serif; background-color: #f4f6f9; padding: 20px; direction: rtl; }
        .container { max-width: 700px; margin: auto; background: white; padding: 20px; border-radius: 8px; }
        .form-group { margin-bottom: 12px; }
        label { display: block; margin-bottom: 5px; font-weight: bold; }
        input, textarea { width: 100%; padding: 8px; box-sizing: border-box; }
        button { background: #28a745; color: white; padding: 10px; border: none; width: 100%; font-weight: bold; cursor: pointer; }
        .product-item { display: flex; justify-content: space-between; align-items: center; background: #eee; padding: 10px; margin-top: 10px; border-radius: 4px; }
        .delete-btn { background: #dc3545; color: white; padding: 5px 10px; text-decoration: none; border-radius: 4px; }
    </style>
</head>
<body>
<div class="container">
    <h2>إضافة منتج جديد 🛍️</h2>
    <form action="/add" method="POST">
        <div class="form-group">
            <label>اسم المنتج:</label>
            <input type="text" name="name" required placeholder="مثال: شاحن سريع">
        </div>
        <div class="form-group">
            <label>رابط صورة المنتج (URL):</label>
            <input type="text" name="image" placeholder="مثال: https://i.imgur.com/example.jpg">
        </div>
        <div class="form-group">
            <label>وصف المنتج:</label>
            <textarea name="description" rows="2" placeholder="وصف قصير..."></textarea>
        </div>
        <div class="form-group">
            <label>السعر:</label>
            <input type="text" name="price" required placeholder="مثال: 50 د.ل">
        </div>
        <button type="submit">إضافة المنتج ➕</button>
    </form>

    <hr style="margin: 20px 0;">

    <h2>المنتجات الحالية 📦</h2>
    {% for product in products %}
    <div class="product-item">
        <div>
            <strong>{{ product.name }}</strong> - <span style="color: green;">{{ product.price }}</span>
            <br><small>{{ product.description }}</small>
        </div>
        <a href="/delete/{{ product.id }}" class="delete-btn">حذف 🗑️</a>
    </div>
    {% else %}
    <p>لا توجد منتجات حالياً.</p>
    {% endfor %}
</div>
</body>
</html>
